<!DOCTYPE html>
<html>

<head>

    <title>Sign Up</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="noise">

    <!-- DARK EDGES -->
    <div class="vignette"></div>

    <div class="container">

        <h1 data-text="Create Account">Create Account</h1>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <a href="/" class="back-link">← back</a>

    </div>

</body>

</html>
