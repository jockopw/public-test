<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="noise">

    <div class="container">

        <h1>Login</h1>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <a href="/" class="back-link">← back</a>

            <a href="/signup" class="back-link-2">← dont have an account? press this to create an account.</a>    

    </div>

</body>

</html>
